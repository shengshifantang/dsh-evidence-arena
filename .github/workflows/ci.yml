name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22.19.0
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  clean-profile-smoke:
    name: Clean DSH rc.7 profile smoke
    needs: verify
    runs-on: ubuntu-latest
    env:
      DSH_HOME: ${{ runner.temp }}/dsh-evidence-arena-profile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p "$RUNNER_TEMP/arena-pack"
      - run: pnpm pack --pack-destination "$RUNNER_TEMP/arena-pack"
      - run: pnpm add --global @deepseek-ai/dsh@0.1.0-rc.7 --registry https://registry.npmjs.org/
      - run: dsh plugin --profile web add "$RUNNER_TEMP/arena-pack/dsh-evidence-arena-0.1.0.tgz" --registry https://registry.npmjs.org/
      - run: node scripts/smoke-profile.mjs
