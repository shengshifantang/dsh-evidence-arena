# Isolated Arena agent runtime. stdout is JSON-RPC only.
- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: true

# Native DeepSeek route. The environment contains the credential reference,
# never the literal key in this configuration document.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKeyEnv: !!js process.env.DSH_ARENA_API_KEY_ENV ?? 'DEEPSEEK_API_KEY'
    thinking: enabled
    reasoningEffort: max

# Harness' provider-neutral adapter. Arena gives each child only its own route
# and only the environment references named by that agent.
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config: !!js JSON.parse(process.env.DSH_ARENA_PI_AI_CONFIG ?? '{"providers":{}}')

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

# Reuse the product sandbox instead of a bare local Bash/filesystem. Builders
# get workspace-write. Reviewers are artifact-only, anonymous, and zero-tool;
# they do not receive repository context or a live candidate worktree.
- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  disabled: !!js process.env.DSH_ARENA_ROLE === 'reviewer'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  disabled: !!js process.env.DSH_ARENA_ROLE === 'reviewer'
  config:
    mode: !!js process.env.DSH_PERMISSION_MODE ?? 'read-only'
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: never

- id: bash
  name: '@deepseek-ai/dsh-bash-sandbox'
  disabled: !!js process.platform === 'win32' || process.env.DSH_ARENA_ROLE === 'reviewer'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    timeoutMs: 60000

# Windows uses the same sandbox-policy seam through the ACL/restricted-token
# PowerShell executor. Only one shell producer is active on a given platform.
- id: pwsh
  name: '@deepseek-ai/dsh-pwsh-sandbox'
  disabled: !!js process.platform !== 'win32' || process.env.DSH_ARENA_ROLE === 'reviewer'
  config:
    timeoutMs: 60000

- id: shell-env-windows
  name: '@deepseek-ai/dsh-shell-env'
  disabled: !!js process.platform !== 'win32' || process.env.DSH_ARENA_ROLE === 'reviewer'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32' || process.env.DSH_ARENA_ROLE === 'reviewer'
  config:
    enableRunInBackground: false

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are an independent Arena agent.'
    includeRuntimeContext: !!js process.env.DSH_ARENA_ROLE !== 'reviewer'
    workspaceContext: !!js "process.env.DSH_ARENA_ROLE === 'reviewer' ? false : ({ maxBytes: 65536 })"
    skills:
      enabled: false
    toolBash: !!js "process.platform === 'win32' || process.env.DSH_ARENA_ROLE === 'reviewer' ? false : ({ enableRunInBackground: false })"
    toolJobs: false

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT
    compression: none

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: fs
  name: '@deepseek-ai/dsh-fs-sandbox'
  disabled: !!js process.env.DSH_ARENA_ROLE === 'reviewer'

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'
  disabled: !!js process.env.DSH_ARENA_ROLE === 'reviewer'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
  disabled: !!js process.env.DSH_ARENA_ROLE === 'reviewer'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  disabled: !!js process.env.DSH_ARENA_ROLE === 'reviewer'
  config:
    allowParallelInProgress: true

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1
