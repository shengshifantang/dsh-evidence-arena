# Isolated Arena agent runtime. stdout is JSON-RPC only.
- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: true

# Native DeepSeek route. The environment contains the credential reference,
# never the literal key in this configuration document.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKeyEnv: !!js process.env.DSH_ARENA_API_KEY_ENV ?? 'DEEPSEEK_API_KEY'
    thinking: enabled
    # Builders keep the strongest reasoning mode. Reviewers must emit a small,
    # machine-validated JSON verdict, so extended hidden reasoning is disabled
    # instead of letting it consume the entire bounded output allowance.
    reasoningEffort: !!js "process.env.DSH_ARENA_ROLE === 'reviewer' ? 'off' : 'max'"

# Harness' provider-neutral adapter. Arena gives each child only its own route
# and only the environment references named by that agent.
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config: !!js JSON.parse(process.env.DSH_ARENA_PI_AI_CONFIG ?? '{"providers":{}}')

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

# Reuse the product sandbox instead of a bare local Bash/filesystem. Builders
# get workspace-write. Reviewers are artifact-only, anonymous, and zero-tool;
# they do not receive repository context or a live candidate worktree.
- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  disabled: !!js process.env.DSH_ARENA_ROLE === 'reviewer'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  disabled: !!js process.env.DSH_ARENA_ROLE === 'reviewer'
  config:
    mode: !!js process.env.DSH_PERMISSION_MODE ?? 'read-only'
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: never

- id: bash
  name: '@deepseek-ai/dsh-bash-sandbox'
  disabled: !!js process.platform === 'win32' || process.env.DSH_ARENA_ROLE === 'reviewer'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    timeoutMs: 60000

# Windows uses the same sandbox-policy seam through the ACL/restricted-token
# PowerShell executor. Only one shell producer is active on a given platform.
- id: pwsh
  name: '@deepseek-ai/dsh-pwsh-sandbox'
  disabled: !!js process.platform !== 'win32' || process.env.DSH_ARENA_ROLE === 'reviewer'
  config:
    timeoutMs: 60000

- id: shell-env-windows
  name: '@deepseek-ai/dsh-shell-env'
  disabled: !!js process.platform !== 'win32' || process.env.DSH_ARENA_ROLE === 'reviewer'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32' || process.env.DSH_ARENA_ROLE === 'reviewer'
  config:
    enableRunInBackground: false

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    # Shell context and user Skill discovery point at an Arena-owned empty
    # per-child home. Never expose the live Host profile, which may hold keys.
    dshHome: !!js process.env.DSH_ARENA_CHILD_HOME
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are an independent Arena agent.'
    includeRuntimeContext: !!js process.env.DSH_ARENA_ROLE !== 'reviewer'
    workspaceContext: !!js "process.env.DSH_ARENA_ROLE === 'reviewer' ? false : ({ maxBytes: 65536 })"
    skills:
      # Builders discover repository-owned .dsh/.agents Skills plus the empty
      # isolated user root. Reviewers remain sealed-evidence-only.
      enabled: !!js process.env.DSH_ARENA_ROLE !== 'reviewer'
      filesystem:
        agentsHome: !!js process.env.DSH_ARENA_CHILD_AGENTS_HOME
        watch: false
    # Long engineering tasks need background servers/builds and bounded job
    # collection. The Reviewer contract stays zero-tool.
    toolBash: !!js "process.platform === 'win32' || process.env.DSH_ARENA_ROLE === 'reviewer' ? false : ({ enableRunInBackground: true })"
    toolJobs: !!js "process.env.DSH_ARENA_ROLE === 'reviewer' ? false : ({})"

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT
    compression: none

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: fs
  name: '@deepseek-ai/dsh-fs-sandbox'
  disabled: !!js process.env.DSH_ARENA_ROLE === 'reviewer'

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'
  disabled: !!js process.env.DSH_ARENA_ROLE === 'reviewer'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
  disabled: !!js process.env.DSH_ARENA_ROLE === 'reviewer'

# Production coding capabilities that the stock Web standard/code presets also
# expose. Arena composes them explicitly because an SDK subprocess is a fresh
# Harness runtime and cannot safely inherit arbitrary live Host plugins.
- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  disabled: !!js process.env.DSH_ARENA_ROLE === 'reviewer'
  config:
    sampleOverCapGlobResults: false

- id: tool-str-replace-editor
  name: '@deepseek-ai/dsh-tool-str-replace-editor'
  disabled: !!js process.env.DSH_ARENA_ROLE === 'reviewer'
  config:
    maxOutputChars: 16000

# In-process DSH subagents let a Builder split a large task without leaving its
# isolated worktree. Every child request and token remains in the SDK session
# event tree observed by Arena.
- id: subagent
  name: '@deepseek-ai/dsh-subagent'
  disabled: !!js process.env.DSH_ARENA_ROLE === 'reviewer'

- id: subagent-spawn
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  disabled: !!js process.env.DSH_ARENA_ROLE === 'reviewer'
  config:
    providerName: spawn

- id: tool-subagent-control
  name: '@deepseek-ai/dsh-tool-subagent-control'
  disabled: !!js process.env.DSH_ARENA_ROLE === 'reviewer'

- id: tool-subagent-list-agents
  name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
  disabled: !!js process.env.DSH_ARENA_ROLE === 'reviewer'

- id: tool-subagent-report
  name: '@deepseek-ai/dsh-tool-subagent-report'
  disabled: !!js process.env.DSH_ARENA_ROLE === 'reviewer'

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  disabled: !!js process.env.DSH_ARENA_ROLE === 'reviewer'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: continuable

- id: tool-result-pruner
  name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
  disabled: !!js process.env.DSH_ARENA_ROLE === 'reviewer'
  config:
    thresholdChars: 8192
    headChars: 4096
    tailChars: 1024

- id: repeat-tool-reminder
  name: '@deepseek-ai/dsh-repeat-tool-reminder'
  disabled: !!js process.env.DSH_ARENA_ROLE === 'reviewer'
  config:
    thresholds: [3, 5, 8]
    argumentsPreviewChars: 500

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  disabled: !!js process.env.DSH_ARENA_ROLE === 'reviewer'
  config:
    allowParallelInProgress: true

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1
